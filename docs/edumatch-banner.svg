  </text>

  <g transform="translate(1290 68)">
    <rect width="190" height="44" rx="22" fill="#0f172a" stroke="#334155"/>
    <circle cx="25" cy="22" r="6" fill="#22d3ee"/>
    <text x="43" y="28" font-family="Arial, Helvetica, sans-serif"
