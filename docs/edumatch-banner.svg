    <radialGradient id="glow2">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="420" rx="26" fill="url(#bg)"/>
  <circle cx="240" cy="80" r="260" fill="url(#glow1)"/>
  <circle cx="1390" cy="340" r="300" fill="url(#glow2)"/>

  <g stroke="#38bdf8" stroke-opacity=".22" stroke-width="2" fill="none">
    <path d="M70 330 L230 235 L355 300 L500 180 L650 250"/>
    <path d="M1060 110 L1180 190 L1300 120 L1470 225 L1540 155"/>
    <path d="M1160 320 L1270 250 L1410 300 L1510 245"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="70" cy="330" r="5"/><circle cx="230" cy="235" r="6"/>
    <circle cx="355" cy="300" r="5"/><circle cx="500" cy="180" r="6"/>
    <circle cx="650" cy="250" r="5"/><circle cx="1060" cy="110" r="5"/>
    <circle cx="1180" cy="190" r="6"/><circle cx="1300" cy="120" r="5"/>
    <circle cx="1470" cy="225" r="6"/><circle cx="1540" cy="155" r="5"/>
  </g>

  <rect x="120" y="78" width="62" height="62" rx="16" fill="#22d3ee"/>
  <text x="151" y="119" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
