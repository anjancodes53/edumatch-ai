<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">EduMatch AI</title>
  <desc id="desc">EduMatch AI banner with the tagline Analyze. Segment. Learn Smarter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="52%" stop-color="#07152d"/>
      <stop offset="100%" stop-color="#170a2e"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
